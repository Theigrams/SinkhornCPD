[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkhorn-cpd"
version = "0.1.0"
description = "Sinkhorn-CPD: Robust Point Cloud Registration via Unbalanced Entropic Optimal Transport"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "pandas",
    "scipy",
    "tqdm",
    "matplotlib",
    "open3d",
    "probreg",
]

[tool.setuptools]
py-modules = ["sinkhorn_cpd", "metrics"]
packages = ["analysis", "baselines", "experiments"]
